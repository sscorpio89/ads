<svg width="1500" height="1500" xmlns="http://www.w3.org/2000/svg">
  <!-- Белый фон -->
  <rect width="1500" height="1500" fill="#FFFFFF"/>

  <!-- Центральное сиденье (вид сверху) -->
  <circle cx="750" cy="750" r="400" fill="#C9A978"/>

  <!-- Градиент для объёма -->
  <defs>
    <radialGradient id="topGradient">
      <stop offset="0%" style="stop-color:#D4B896;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#C9A978;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8956A;stop-opacity:1" />
    </radialGradient>

    <!-- Паттерн древесных колец -->
    <pattern id="woodRings" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="100" cy="100" r="80" stroke="#9D7D52" stroke-width="3" fill="none" opacity="0.2"/>
      <circle cx="100" cy="100" r="65" stroke="#9D7D52" stroke-width="2" fill="none" opacity="0.15"/>
      <circle cx="100" cy="100" r="50" stroke="#9D7D52" stroke-width="2" fill="none" opacity="0.12"/>
      <circle cx="100" cy="100" r="35" stroke="#9D7D52" stroke-width="1.5" fill="none" opacity="0.1"/>
      <circle cx="100" cy="100" r="20" stroke="#9D7D52" stroke-width="1" fill="none" opacity="0.08"/>
    </pattern>

    <!-- Паттерн текстуры волокон -->
    <pattern id="woodGrain" x="0" y="0" width="150" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <path d="M0,50 Q30,48 60,50 Q90,52 120,50 Q150,48 180,50" stroke="#9D7D52" stroke-width="2" fill="none" opacity="0.15"/>
      <path d="M0,65 Q30,63 60,65 Q90,67 120,65 Q150,63 180,65" stroke="#9D7D52" stroke-width="1.5" fill="none" opacity="0.12"/>
      <path d="M0,80 Q30,78 60,80 Q90,82 120,80 Q150,78 180,80" stroke="#9D7D52" stroke-width="1" fill="none" opacity="0.1"/>
      <path d="M0,35 Q30,33 60,35 Q90,37 120,35 Q150,33 180,35" stroke="#9D7D52" stroke-width="1.5" fill="none" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Применение градиента -->
  <circle cx="750" cy="750" r="400" fill="url(#topGradient)"/>

  <!-- Кольца роста (смещены от центра для естественности) -->
  <circle cx="680" cy="720" r="350" stroke="#9D7D52" stroke-width="4" fill="none" opacity="0.2"/>
  <circle cx="680" cy="720" r="300" stroke="#9D7D52" stroke-width="3" fill="none" opacity="0.18"/>
  <circle cx="680" cy="720" r="250" stroke="#9D7D52" stroke-width="3" fill="none" opacity="0.16"/>
  <circle cx="680" cy="720" r="200" stroke="#9D7D52" stroke-width="2.5" fill="none" opacity="0.14"/>
  <circle cx="680" cy="720" r="150" stroke="#9D7D52" stroke-width="2" fill="none" opacity="0.12"/>
  <circle cx="680" cy="720" r="100" stroke="#9D7D52" stroke-width="2" fill="none" opacity="0.1"/>
  <circle cx="680" cy="720" r="50" stroke="#9D7D52" stroke-width="1.5" fill="none" opacity="0.08"/>

  <!-- Текстура волокон -->
  <circle cx="750" cy="750" r="395" fill="url(#woodGrain)" opacity="0.5"/>

  <!-- Ножки (вид сверху - круги) -->
  <circle cx="550" cy="550" r="35" fill="#B8956A"/>
  <circle cx="550" cy="550" r="30" fill="#C9A978"/>

  <circle cx="950" cy="550" r="35" fill="#B8956A"/>
  <circle cx="950" cy="550" r="30" fill="#C9A978"/>

  <circle cx="550" cy="950" r="35" fill="#B8956A"/>
  <circle cx="550" cy="950" r="30" fill="#C9A978"/>

  <circle cx="950" cy="950" r="35" fill="#B8956A"/>
  <circle cx="950" cy="950" r="30" fill="#C9A978"/>

  <!-- Блики от масла-воска -->
  <circle cx="800" cy="680" r="80" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="650" cy="800" r="60" fill="#FFFFFF" opacity="0.08"/>

  <!-- Тень от сиденья -->
  <circle cx="750" cy="750" r="405" stroke="#9D7D52" stroke-width="3" fill="none" opacity="0.15"/>

  <!-- Размеры -->
  <g id="dimensions">
    <line x1="350" y1="750" x2="1150" y2="750" stroke="#333333" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="350" y1="730" x2="350" y2="770" stroke="#333333" stroke-width="2"/>
    <line x1="1150" y1="730" x2="1150" y2="770" stroke="#333333" stroke-width="2"/>
    <text x="750" y="800" font-family="Arial, sans-serif" font-size="32" fill="#333333" text-anchor="middle" font-weight="bold">
      ⌀ 32 см
    </text>
  </g>

  <!-- Логотип -->
  <text x="750" y="1450" font-family="Arial, sans-serif" font-size="24" fill="#999999" text-anchor="middle">
    Вид сверху | Массив дуба
  </text>
</svg>
