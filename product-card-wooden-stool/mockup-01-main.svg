<svg width="1500" height="1500" xmlns="http://www.w3.org/2000/svg">
  <!-- Белый фон -->
  <rect width="1500" height="1500" fill="#FFFFFF"/>

  <!-- Тень от табурета -->
  <ellipse cx="750" cy="1200" rx="280" ry="40" fill="#000000" opacity="0.08"/>

  <!-- Ножки табурета -->
  <g id="legs">
    <!-- Передняя левая ножка -->
    <rect x="550" y="700" width="60" height="500" fill="#B8956A" rx="30"/>
    <rect x="550" y="700" width="60" height="50" fill="#C9A978" rx="30"/>

    <!-- Передняя правая ножка -->
    <rect x="890" y="700" width="60" height="500" fill="#B8956A" rx="30"/>
    <rect x="890" y="700" width="60" height="50" fill="#C9A978" rx="30"/>

    <!-- Задняя левая ножка (частично видна) -->
    <rect x="620" y="700" width="50" height="500" fill="#9D7D52" rx="25"/>

    <!-- Задняя правая ножка (частично видна) -->
    <rect x="830" y="700" width="50" height="500" fill="#9D7D52" rx="25"/>
  </g>

  <!-- Сиденье табурета (эллипс) -->
  <ellipse cx="750" cy="700" rx="320" ry="160" fill="#C9A978"/>

  <!-- Текстура дерева на сиденье -->
  <ellipse cx="750" cy="700" rx="320" ry="160" fill="url(#woodGradient)" opacity="0.3"/>

  <!-- Градиент для имитации текстуры дерева -->
  <defs>
    <radialGradient id="woodGradient">
      <stop offset="0%" style="stop-color:#D4B896;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A978;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#B8956A;stop-opacity:1" />
    </radialGradient>

    <!-- Паттерн древесины -->
    <pattern id="woodPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M0,50 Q25,45 50,50 T100,50" stroke="#9D7D52" stroke-width="2" fill="none" opacity="0.3"/>
      <path d="M0,55 Q25,52 50,55 T100,55" stroke="#9D7D52" stroke-width="1.5" fill="none" opacity="0.2"/>
      <path d="M0,45 Q25,42 50,45 T100,45" stroke="#9D7D52" stroke-width="1" fill="none" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Применение паттерна -->
  <ellipse cx="750" cy="700" rx="300" ry="150" fill="url(#woodPattern)" opacity="0.4"/>

  <!-- Блики на сиденье (матовое покрытие маслом) -->
  <ellipse cx="680" cy="660" rx="100" ry="40" fill="#FFFFFF" opacity="0.15"/>
  <ellipse cx="820" cy="680" rx="80" ry="30" fill="#FFFFFF" opacity="0.1"/>

  <!-- Кольца роста дерева -->
  <ellipse cx="750" cy="700" rx="280" ry="140" stroke="#9D7D52" stroke-width="3" fill="none" opacity="0.2"/>
  <ellipse cx="750" cy="700" rx="240" ry="120" stroke="#9D7D52" stroke-width="2" fill="none" opacity="0.15"/>
  <ellipse cx="750" cy="700" rx="200" ry="100" stroke="#9D7D52" stroke-width="2" fill="none" opacity="0.1"/>

  <!-- Логотип или водяной знак -->
  <text x="750" y="1450" font-family="Arial, sans-serif" font-size="24" fill="#999999" text-anchor="middle">
    Мастерская "Родное дерево"
  </text>
</svg>
