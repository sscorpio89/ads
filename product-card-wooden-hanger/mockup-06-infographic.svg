<svg width="1500" height="1500" xmlns="http://www.w3.org/2000/svg">
  <!-- Белый фон -->
  <rect width="1500" height="1500" fill="#FFFFFF"/>

  <!-- Заголовок -->
  <text x="750" y="80" font-family="Arial, sans-serif" font-size="48" fill="#333333" text-anchor="middle" font-weight="bold">
    Вешалка-плечики деревянная "Premium"
  </text>

  <!-- Подзаголовок -->
  <text x="750" y="130" font-family="Arial, sans-serif" font-size="28" fill="#666666" text-anchor="middle">
    Набор из 3 штук | Ручная работа | Массив бука
  </text>

  <!-- Упрощённое изображение вешалки -->
  <g id="hanger-illustration" transform="translate(550, 200)">
    <!-- Крючок -->
    <rect x="198" y="20" width="4" height="60" fill="#C0C0C0" rx="2"/>
    <circle cx="200" cy="15" r="10" fill="#CCCCCC"/>

    <!-- Вешалка -->
    <path d="M 50 100 Q 200 70 350 100" stroke="#B8956A" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M 50 100 Q 200 70 350 100" stroke="#C9A978" stroke-width="22" fill="none" stroke-linecap="round"/>

    <!-- Перекладина -->
    <line x1="80" y1="150" x2="320" y2="150" stroke="#B8956A" stroke-width="10" stroke-linecap="round"/>

    <!-- Текстура -->
    <path d="M 60 100 Q 200 72 340 100" stroke="#8B6F47" stroke-width="2" fill="none" opacity="0.3"/>

    <!-- Размеры -->
    <line x1="50" y1="180" x2="350" y2="180" stroke="#FF6B6B" stroke-width="2"/>
    <line x1="50" y1="170" x2="50" y2="190" stroke="#FF6B6B" stroke-width="2"/>
    <line x1="350" y1="170" x2="350" y2="190" stroke="#FF6B6B" stroke-width="2"/>
    <text x="200" y="215" font-family="Arial, sans-serif" font-size="32" fill="#FF6B6B" text-anchor="middle" font-weight="bold">
      44 см
    </text>
  </g>

  <!-- Ключевые характеристики в блоках -->
  <g id="features">
    <!-- Блок 1: Материал -->
    <rect x="100" y="500" width="300" height="150" fill="#C9A978" rx="15"/>
    <text x="250" y="550" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      Материал
    </text>
    <text x="250" y="595" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      Массив бука
    </text>
    <text x="250" y="630" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">
      Премиум качество
    </text>

    <!-- Блок 2: Максимальная нагрузка -->
    <rect x="450" y="500" width="300" height="150" fill="#FF6B6B" rx="15"/>
    <text x="600" y="550" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      Нагрузка
    </text>
    <text x="600" y="600" font-family="Arial, sans-serif" font-size="52" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      5 кг
    </text>
    <text x="600" y="630" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">
      Пальто и шубы
    </text>

    <!-- Блок 3: Покрытие -->
    <rect x="800" y="500" width="300" height="150" fill="#4ECDC4" rx="15"/>
    <text x="950" y="550" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      Покрытие
    </text>
    <text x="950" y="595" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      Масло-воск
    </text>
    <text x="950" y="630" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">
      Экологичное
    </text>

    <!-- Блок 4: Анатомическая форма -->
    <rect x="100" y="700" width="300" height="150" fill="#95E1D3" rx="15"/>
    <text x="250" y="745" font-family="Arial, sans-serif" font-size="22" fill="#333333" text-anchor="middle" font-weight="bold">
      Анатомическая
    </text>
    <text x="250" y="775" font-family="Arial, sans-serif" font-size="22" fill="#333333" text-anchor="middle" font-weight="bold">
      форма плечиков
    </text>
    <text x="250" y="815" font-family="Arial, sans-serif" font-size="18" fill="#333333" text-anchor="middle">
      Сохраняет одежду
    </text>

    <!-- Блок 5: Набор -->
    <rect x="450" y="700" width="300" height="150" fill="#F8B500" rx="15"/>
    <text x="600" y="755" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      В наборе
    </text>
    <text x="600" y="810" font-family="Arial, sans-serif" font-size="52" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      3 шт
    </text>

    <!-- Блок 6: Ручная работа -->
    <rect x="800" y="700" width="300" height="150" fill="#6C5CE7" rx="15"/>
    <text x="950" y="760" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      ✋ Ручная работа
    </text>
    <text x="950" y="800" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">
      Мастер
    </text>
    <text x="950" y="830" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">
      15 лет опыта
    </text>

    <!-- Блок 7: Вращающийся крючок -->
    <rect x="100" y="900" width="420" height="120" fill="#E8F5E9" rx="15"/>
    <text x="310" y="970" font-family="Arial, sans-serif" font-size="28" fill="#333333" text-anchor="middle" font-weight="bold">
      🔄 Вращающийся крючок 360°
    </text>

    <!-- Блок 8: Перекладина -->
    <rect x="580" y="900" width="420" height="120" fill="#FFF3E0" rx="15"/>
    <text x="790" y="970" font-family="Arial, sans-serif" font-size="28" fill="#333333" text-anchor="middle" font-weight="bold">
      📏 Съёмная перекладина
    </text>

    <!-- Блок 9: Гарантия и Россия -->
    <rect x="100" y="1070" width="200" height="100" fill="#28A745" rx="15"/>
    <text x="200" y="1110" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      Гарантия
    </text>
    <text x="200" y="1145" font-family="Arial, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      12 мес
    </text>

    <rect x="350" y="1070" width="200" height="100" fill="#2196F3" rx="15"/>
    <text x="450" y="1125" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      🇷🇺 Россия
    </text>

    <!-- Блок 10: Подарочная упаковка -->
    <rect x="600" y="1070" width="400" height="100" fill="#E91E63" rx="15"/>
    <text x="800" y="1125" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      🎁 Подарочная упаковка
    </text>
  </g>

  <!-- Цена -->
  <g id="price">
    <rect x="200" y="1230" width="1100" height="120" fill="#28A745" rx="20"/>
    <text x="400" y="1285" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="start">
      Цена за набор:
    </text>
    <text x="680" y="1285" font-family="Arial, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="start" text-decoration="line-through">
      2990 ₽
    </text>
    <text x="920" y="1310" font-family="Arial, sans-serif" font-size="64" fill="#FFFFFF" text-anchor="start" font-weight="bold">
      2490 ₽
    </text>
    <rect x="1200" y="1240" width="90" height="50" fill="#FF6B6B" rx="10"/>
    <text x="1245" y="1275" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
      -17%
    </text>
    <text x="750" y="1335" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">
      Всего 830 ₽ за одну вешалку!
    </text>
  </g>

  <!-- Футер -->
  <text x="750" y="1410" font-family="Arial, sans-serif" font-size="24" fill="#999999" text-anchor="middle">
    Мастерская "Родное дерево" | Бесплатная доставка от 3000 ₽
  </text>
  <text x="750" y="1450" font-family="Arial, sans-serif" font-size="20" fill="#AAAAAA" text-anchor="middle">
    Ширина 44 см • Толщина 1.2 см • Вес 150 г
  </text>
</svg>
