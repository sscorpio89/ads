<svg width="1500" height="1500" xmlns="http://www.w3.org/2000/svg">
  <!-- Белый фон -->
  <rect width="1500" height="1500" fill="#FFFFFF"/>

  <!-- Вешалка 1 (задняя левая) -->
  <g id="hanger1" transform="translate(350, 400) rotate(-15)">
    <!-- Крючок -->
    <rect x="198" y="20" width="4" height="80" fill="#C0C0C0" rx="2"/>
    <circle cx="200" cy="15" r="8" fill="#C0C0C0"/>

    <!-- Основание вешалки -->
    <path d="M 100 100 Q 200 80 300 100" stroke="#A0826D" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M 100 100 Q 200 80 300 100" stroke="#B8956A" stroke-width="24" fill="none" stroke-linecap="round"/>

    <!-- Текстура дерева -->
    <path d="M 110 100 Q 200 82 290 100" stroke="#8B6F47" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M 120 102 Q 200 84 280 102" stroke="#8B6F47" stroke-width="1" fill="none" opacity="0.2"/>
  </g>

  <!-- Вешалка 2 (задняя правая) -->
  <g id="hanger2" transform="translate(800, 420) rotate(12)">
    <!-- Крючок -->
    <rect x="198" y="20" width="4" height="80" fill="#C0C0C0" rx="2"/>
    <circle cx="200" cy="15" r="8" fill="#C0C0C0"/>

    <!-- Основание вешалки -->
    <path d="M 100 100 Q 200 80 300 100" stroke="#A0826D" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M 100 100 Q 200 80 300 100" stroke="#B8956A" stroke-width="24" fill="none" stroke-linecap="round"/>

    <!-- Текстура дерева -->
    <path d="M 110 100 Q 200 82 290 100" stroke="#8B6F47" stroke-width="2" fill="none" opacity="0.3"/>
  </g>

  <!-- Вешалка 3 (передняя центральная) -->
  <g id="hanger3" transform="translate(550, 600)">
    <!-- Тень -->
    <ellipse cx="200" cy="220" rx="180" ry="25" fill="#000000" opacity="0.08"/>

    <!-- Крючок -->
    <rect x="198" y="20" width="4" height="80" fill="#CCCCCC" rx="2"/>
    <circle cx="200" cy="15" r="10" fill="#CCCCCC"/>
    <circle cx="200" cy="15" r="8" fill="#E8E8E8"/>

    <!-- Основание вешалки (более детально) -->
    <defs>
      <linearGradient id="woodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#C9A978;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#B8956A;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#A0826D;stop-opacity:1" />
      </linearGradient>
    </defs>

    <!-- Левое плечо -->
    <path d="M 200 100 Q 150 90 100 105" stroke="url(#woodGradient)" stroke-width="30" fill="none" stroke-linecap="round"/>
    <!-- Правое плечо -->
    <path d="M 200 100 Q 250 90 300 105" stroke="url(#woodGradient)" stroke-width="30" fill="none" stroke-linecap="round"/>

    <!-- Блики на дереве -->
    <path d="M 150 95 Q 175 92 200 95" stroke="#FFFFFF" stroke-width="8" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M 200 95 Q 225 92 250 95" stroke="#FFFFFF" stroke-width="8" fill="none" opacity="0.3" stroke-linecap="round"/>

    <!-- Текстура волокон дерева -->
    <path d="M 110 105 Q 150 92 190 100" stroke="#8B6F47" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M 210 100 Q 250 92 290 105" stroke="#8B6F47" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M 120 108 Q 150 96 185 103" stroke="#8B6F47" stroke-width="1" fill="none" opacity="0.2"/>
    <path d="M 215 103 Q 250 96 280 108" stroke="#8B6F47" stroke-width="1" fill="none" opacity="0.2"/>

    <!-- Перекладина для брюк -->
    <line x1="120" y1="140" x2="280" y2="140" stroke="#B8956A" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="140" x2="280" y2="140" stroke="#8B6F47" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Размеры -->
  <g id="dimensions">
    <line x1="550" y1="700" x2="850" y2="700" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="550" y1="690" x2="550" y2="710" stroke="#666666" stroke-width="2"/>
    <line x1="850" y1="690" x2="850" y2="710" stroke="#666666" stroke-width="2"/>
    <text x="700" y="740" font-family="Arial, sans-serif" font-size="28" fill="#666666" text-anchor="middle" font-weight="bold">
      44 см
    </text>
  </g>

  <!-- Текст -->
  <text x="750" y="1100" font-family="Arial, sans-serif" font-size="48" fill="#333333" text-anchor="middle" font-weight="bold">
    Вешалка-плечики Premium
  </text>
  <text x="750" y="1150" font-family="Arial, sans-serif" font-size="32" fill="#666666" text-anchor="middle">
    Набор из 3 штук • Массив бука • Ручная работа
  </text>

  <!-- Логотип -->
  <text x="750" y="1450" font-family="Arial, sans-serif" font-size="24" fill="#999999" text-anchor="middle">
    Мастерская "Родное дерево"
  </text>
</svg>
