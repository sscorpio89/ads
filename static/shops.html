<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои магазины - Ozon FBO Supply Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--tg-theme-text-color);
        }

        h2 {
            font-size: 18px;
            margin: 20px 0 12px;
            color: var(--tg-theme-text-color);
        }

        .section {
            margin-bottom: 24px;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .shop-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
        }

        .shop-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .shop-info {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 4px;
        }

        .shop-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .button {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .button:hover {
            opacity: 0.8;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button-secondary {
            background: var(--tg-theme-hint-color, #999);
            flex: 1;
        }

        .button-danger {
            background: #e74c3c;
            flex: 1;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ddd);
            border-radius: 8px;
            font-size: 16px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }

        input:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #3390ec);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-theme-hint-color, #999);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--tg-theme-hint-color, #999);
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .hidden {
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--tg-theme-bg-color, #fff);
            border-radius: 12px;
            padding: 20px;
            max-width: 90%;
            width: 400px;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏪 Мои магазины</h1>

        <div id="message"></div>

        <!-- Форма добавления магазина -->
        <div class="section">
            <h2>Добавить магазин</h2>
            <div class="card">
                <form id="addShopForm">
                    <div class="form-group">
                        <label for="shopName">Название магазина</label>
                        <input type="text" id="shopName" name="name" placeholder="Мой магазин на Ozon" required>
                    </div>

                    <div class="form-group">
                        <label for="clientId">Client ID</label>
                        <input type="text" id="clientId" name="client_id" placeholder="123456" required>
                    </div>

                    <div class="form-group">
                        <label for="apiKey">API Key</label>
                        <input type="password" id="apiKey" name="api_key" placeholder="Введите API ключ" required>
                    </div>

                    <button type="submit" class="button" id="addButton">
                        Добавить магазин
                    </button>
                </form>
            </div>
        </div>

        <!-- Список магазинов -->
        <div class="section">
            <h2>Мои магазины</h2>
            <div id="shopsList">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Modal подтверждения удаления -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Удалить магазин?</div>
            <p>Вы уверены, что хотите удалить этот магазин? Это действие нельзя отменить.</p>
            <div class="modal-actions">
                <button class="button button-secondary" onclick="closeDeleteModal()">Отмена</button>
                <button class="button button-danger" id="confirmDelete">Удалить</button>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        // API URL
        const API_BASE = window.location.origin;

        // Получаем User ID
        const userId = tg.initDataUnsafe?.user?.id || 123456789;

        // State
        let shops = [];
        let shopToDelete = null;

        // DOM Elements
        const addShopForm = document.getElementById('addShopForm');
        const addButton = document.getElementById('addButton');
        const shopsList = document.getElementById('shopsList');
        const messageDiv = document.getElementById('message');
        const deleteModal = document.getElementById('deleteModal');
        const confirmDeleteBtn = document.getElementById('confirmDelete');

        // Helper функции
        function showMessage(text, type = 'success') {
            messageDiv.className = type;
            messageDiv.textContent = text;
            messageDiv.classList.remove('hidden');
            setTimeout(() => {
                messageDiv.classList.add('hidden');
            }, 3000);
        }

        function showError(text) {
            showMessage(text, 'error');
        }

        async function apiRequest(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-User-Id': userId.toString(),
                        ...options.headers,
                    },
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Ошибка запроса');
                }

                return data;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // Загрузка списка магазинов
        async function loadShops() {
            try {
                shopsList.innerHTML = '<div class="loading">Загрузка...</div>';

                const data = await apiRequest('/api/shops/list');
                shops = data.shops || [];

                renderShops();
            } catch (error) {
                shopsList.innerHTML = `<div class="error">Ошибка загрузки: ${error.message}</div>`;
            }
        }

        // Отрисовка списка магазинов
        function renderShops() {
            if (shops.length === 0) {
                shopsList.innerHTML = `
                    <div class="empty-state">
                        <p>У вас пока нет добавленных магазинов</p>
                        <p style="margin-top: 8px; font-size: 14px;">Добавьте свой первый магазин выше</p>
                    </div>
                `;
                return;
            }

            shopsList.innerHTML = shops.map(shop => `
                <div class="shop-card" data-shop-id="${shop.shop_id}">
                    <div class="shop-name">${escapeHtml(shop.name)}</div>
                    <div class="shop-info">Client ID: ${escapeHtml(shop.client_id)}</div>
                    <div class="shop-info">
                        Добавлен: ${new Date(shop.created_at).toLocaleDateString('ru-RU')}
                    </div>
                    <div class="shop-actions">
                        <button class="button button-danger" onclick="deleteShop(${shop.shop_id})">
                            Удалить
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Добавление магазина
        addShopForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(addShopForm);
            const data = {
                name: formData.get('name'),
                client_id: formData.get('client_id'),
                api_key: formData.get('api_key'),
            };

            addButton.disabled = true;
            addButton.textContent = 'Добавление...';

            try {
                const result = await apiRequest('/api/shops/add', {
                    method: 'POST',
                    body: JSON.stringify(data),
                });

                showMessage(result.message || 'Магазин успешно добавлен!');
                addShopForm.reset();
                await loadShops();

                // Вибрация при успехе
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } catch (error) {
                showError(error.message || 'Ошибка при добавлении магазина');

                // Вибрация при ошибке
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            } finally {
                addButton.disabled = false;
                addButton.textContent = 'Добавить магазин';
            }
        });

        // Удаление магазина
        function deleteShop(shopId) {
            shopToDelete = shopId;
            deleteModal.classList.add('active');

            // Вибрация при открытии модального окна
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function closeDeleteModal() {
            deleteModal.classList.remove('active');
            shopToDelete = null;
        }

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!shopToDelete) return;

            confirmDeleteBtn.disabled = true;
            confirmDeleteBtn.textContent = 'Удаление...';

            try {
                await apiRequest(`/api/shops/${shopToDelete}`, {
                    method: 'DELETE',
                });

                showMessage('Магазин успешно удален');
                closeDeleteModal();
                await loadShops();

                // Вибрация при успехе
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } catch (error) {
                showError(error.message || 'Ошибка при удалении магазина');

                // Вибрация при ошибке
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            } finally {
                confirmDeleteBtn.disabled = false;
                confirmDeleteBtn.textContent = 'Удалить';
            }
        });

        // Утилиты
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Закрытие модального окна по клику вне его
        deleteModal.addEventListener('click', (e) => {
            if (e.target === deleteModal) {
                closeDeleteModal();
            }
        });

        // Инициализация
        loadShops();

        // Настройка MainButton
        tg.MainButton.text = "Назад";
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            window.location.href = '/';
        });
    </script>
</body>
</html>
